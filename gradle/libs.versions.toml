[versions]
kotlin = "2.0.0"
composeBom = "2024.06.00"
agp = "8.5.0"
okhttp = "4.12.0"
exoplayer = "2.19.1"
camerax = "1.3.4"
kotlinxCoroutines = "1.8.1"

[libraries]
androidx-activity-compose = "androidx.activity:activity-compose:1.9.0"
androidx-compose-bom = "androidx.compose:compose-bom:{version}"
androidx-compose-ui = "androidx.compose.ui:ui"
androidx-compose-material3 = "androidx.compose.material3:material3"
androidx-lifecycle-runtime = "androidx.lifecycle:lifecycle-runtime-ktx:2.8.3"
okhttp = "com.squareup.okhttp3:okhttp:{okhttp}"
okhttp-logging = "com.squareup.okhttp3:logging-interceptor:{okhttp}"
exoplayer = "com.google.android.exoplayer:exoplayer:{exoplayer}"
camerax-core = "androidx.camera:camera-core:{camerax}"
camerax-camera2 = "androidx.camera:camera-camera2:{camerax}"
camerax-lifecycle = "androidx.camera:camera-lifecycle:{camerax}"
camerax-view = "androidx.camera:camera-view:1.3.3"
kotlinx-coroutines-android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:{kotlinxCoroutines}"

[plugins]
android-application = { id = "com.android.application", version = "{agp}" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version = "{kotlin}" }
