name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanctra-android-apk
          path: app/build/outputs/**/*.apk

      - name: Auth to Google Cloud (OIDC)
        if: false # GCS upload disabled; use headless auth/impersonation workflow
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-ci@sanctra.iam.gserviceaccount.com

      - name: Setup gcloud
        if: false # GCS upload disabled; use headless auth/impersonation workflow
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: sanctra

      - name: Upload APKs to GCS
        if: false # GCS upload disabled; use headless auth/impersonation workflow
        run: |
          gsutil -m rsync -r app/build/outputs/ gs://avatars-renders/android-builds/${{ github.sha }}/
